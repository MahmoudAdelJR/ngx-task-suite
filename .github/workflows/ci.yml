name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build Library
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Pack Tarball Verification
        run: npm pack --workspace=projects/ngx-task || npm pack
